name: wikidata-drift
# Weekly coordinate cross-check against Wikidata (CC0). Detect-only:
# drift files an issue for HUMAN review — the pipeline never edits data.
on:
  schedule:
    - cron: "45 2 * * 1"   # Mondays 02:45 UTC (08:15 IST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: run
        run: |
          set +e
          node scripts/wikidata-drift.mjs | tee drift.log
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: File issue on drift
        if: steps.run.outputs.code == '78'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/wikidata-drift.json', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Wikidata coordinate drift detected — ${new Date().toISOString().slice(0,10)}`,
              labels: ['data-verification'],
              body: 'The weekly Wikidata cross-check found coordinates drifting >2 km from our records. **Review by hand and update data/sites.json with a citation — never auto-apply.**\n\n```json\n' + report + '\n```'
            });
